name: Bug report
description: Something is wrong or a sensor is missing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Hardware differs a lot between PCs, so the sensor report below is the most useful thing you can attach.

        **Needs a tester:** these were built without the hardware to try them on. Reports from these setups are especially welcome, even when everything works:
        - **Hybrid-graphics laptop** (NVIDIA or AMD discrete GPU plus integrated graphics): does the discrete GPU show as "Off / asleep" on battery, and stay asleep (Device Manager → the GPU → Details → Power data shows D3)?
        - **Windows 10:** do the taskbar stats stay clear of your app buttons? `PCVitals.exe --taskbar-report report.txt` shows what was found.
        - **PCs with many drives** (10+, RAID or USB enclosures): does PC Vitals start? Attach `error.log` either way.
        - **Two identical NVIDIA cards:** does each show its own power reading?
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard
        2. Click …
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings → System → About (e.g. Windows 11 24H2, build 26100)
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, GPU(s) and PC type
      placeholder: e.g. Intel i7-13700H, NVIDIA RTX 4060 Laptop + Intel UHD, laptop
  - type: dropdown
    id: admin
    attributes:
      label: Running as administrator?
      options:
        - "Yes"
        - "No (limited mode)"
        - Not sure
  - type: dropdown
    id: pawnio
    attributes:
      label: PawnIO driver installed?
      description: Settings → About shows this.
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: textarea
    id: report
    attributes:
      label: Sensor report and error log
      description: |
        Settings → About → **Save sensor report…**, then drag the file here.
        If something crashed or misbehaved, also attach `%APPDATA%\PCVitals\error.log`.
